<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mus&Co. Admin</title>
<style>body{margin:0;background:#f3ede5;color:#191613;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1000px;margin:auto;padding:24px 16px}.head{background:#191613;color:#fff;padding:18px;border-radius:14px}.head b{font:27px Georgia,serif}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fffaf4;border:1px solid #d8cec2;border-radius:14px;padding:16px;margin-top:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:0;background:#191613;color:#fff;border-radius:9px;padding:10px 13px}.alt{background:#fff;color:#191613;border:1px solid #d8cec2}.field{margin:9px 0}.field label{display:block;font-size:11px;color:#756d65;margin-bottom:4px}.field input,.field select{width:100%;padding:9px;border:1px solid #d8cec2;border-radius:8px;background:#fff;box-sizing:border-box}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px 5px;border-bottom:1px solid #ddd;text-align:left}.muted{color:#756d65;font-size:12px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px}.show{display:flex}.box{background:#fffaf4;border-radius:16px;padding:20px;width:min(520px,100%)}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><b>Mus&Co.</b><div style="font-size:10px;letter-spacing:.15em">ADMIN · BY BEYOUTIFUL STUDIO</div></div>
<div class="grid"><div class="card">产品总数<h2 id="pc">0</h2></div><div class="card">上架中<h2 id="live">0</h2></div><div class="card">库存<h2 id="stock">0</h2></div></div>
<div class="card"><div class="toolbar"><div><h2>Products</h2><div class="muted">以后可以自己 Add Product。</div></div><button class="btn" onclick="edit(-1)">＋ Add Product</button></div><div style="overflow:auto"><table><thead><tr><th>产品</th><th>价格</th><th>库存</th><th>状态</th><th></th></tr></thead><tbody id="table"></tbody></table></div></div>
<div class="card"><h2>8周年优惠</h2><div class="field"><label>消费满 RM</label><input id="threshold" type="number"></div><div class="field"><label>直接扣 RM</label><input id="discount" type="number"></div><div class="field"><label>订单 WhatsApp（国际格式，不含 +）</label><input id="wa" placeholder="6012XXXXXXX"></div><button class="btn" onclick="saveSet()">保存设置</button></div>
<div class="card"><h2>Orders</h2><div id="ordersBox"></div></div></div>
<div class="modal" id="m"><div class="box"><h2 id="mt">Add Product</h2><div class="field"><label>产品名称</label><input id="n"></div><div class="field"><label>规格</label><input id="s"></div><div class="field"><label>价格 RM</label><input id="p" type="number"></div><div class="field"><label>库存</label><input id="q" type="number"></div><div class="field"><label>产品图片</label><input id="photo" type="file" accept="image/*" onchange="previewPhoto()"><button class="btn" id="uploadBtn" type="button" onclick="uploadPhoto()" style="margin-top:8px">Upload Photo</button><img id="photoPreview" style="display:none;width:100%;max-height:220px;object-fit:contain;margin-top:10px;border-radius:10px;background:#eee"></div><input id="im" type="hidden"><div class="field"><label>状态</label><select id="a"><option value="1">上架</option><option value="0">下架</option></select></div><button class="btn" onclick="save()">保存</button> <button class="btn alt" onclick="m.classList.remove('show')">取消</button></div></div>
<script>
let state={products:[],settings:{threshold:300,discount:80,whatsapp:''},orders:[]},P=[],idx=-1;
const $=id=>document.getElementById(id);
async function api(url,opts={}){let r=await fetch(url,{cache:'no-store',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});let x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.error||'Request failed');return x}
async function load(){
  try{state=await api('/api/data');P=state.products||[];threshold.value=state.settings?.threshold??300;discount.value=state.settings?.discount??80;wa.value=state.settings?.whatsapp||'';render();renderOrders();}
  catch(e){alert('无法读取云端资料：'+e.message)}
}
async function persist(){state.products=P;state.settings={threshold:+threshold.value||300,discount:+discount.value||80,whatsapp:wa.value.trim()};await api('/api/data',{method:'PUT',body:JSON.stringify(state)})}
function render(){pc.textContent=P.length;live.textContent=P.filter(x=>x.active).length;stock.textContent=P.reduce((a,x)=>a+(+x.stock||0),0);table.innerHTML=P.map((x,i)=>`<tr><td><b>${x.name}</b><div class="muted">${x.size||''}</div></td><td>RM${(+x.price).toFixed(2)}</td><td>${x.stock}</td><td>${x.active?'上架':'下架'}</td><td><button onclick="edit(${i})">编辑</button> <button onclick="toggle(${i})">${x.active?'下架':'上架'}</button> <button onclick="del(${i})">删除</button></td></tr>`).join('')}
function edit(i){idx=i;let x=i<0?{name:'',size:'',price:'',stock:0,image:'',active:true}:P[i];mt.textContent=i<0?'Add Product':'Edit Product';n.value=x.name;s.value=x.size||'';p.value=x.price;q.value=x.stock;im.value=x.image||'';a.value=x.active?'1':'0';m.classList.add('show')}
async function save(){try{let x={id:idx<0?'p'+Date.now():P[idx].id,name:n.value.trim(),size:s.value.trim(),price:+p.value||0,stock:+q.value||0,image:im.value.trim(),active:a.value==='1'};if(!x.name)return alert('请填写产品名称');idx<0?P.push(x):P[idx]=x;await persist();m.classList.remove('show');render();alert('已保存到云端');}catch(e){alert('保存失败：'+e.message)}}
async function uploadPhoto(){let file=photo.files[0];if(!file)return alert('请选择图片');if(file.size>4*1024*1024)return alert('图片请控制在 4MB 以内');try{uploadBtn.disabled=true;uploadBtn.textContent='上传中…';let data=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});let r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:file.name,type:file.type,data})});let x=await r.json();if(!r.ok)throw new Error(x.error||'上传失败');im.value=x.url;photoPreview.src=x.url;photoPreview.style.display='block';}catch(e){alert('图片上传失败：'+e.message)}finally{uploadBtn.disabled=false;uploadBtn.textContent='Upload Photo'}}
function previewPhoto(){let f=photo.files[0];if(f){photoPreview.src=URL.createObjectURL(f);photoPreview.style.display='block'}}
async function toggle(i){P[i].active=!P[i].active;try{await persist();render()}catch(e){P[i].active=!P[i].active;alert('操作失败：'+e.message)}}
async function del(i){if(!confirm('确定删除？'))return;let old=P[i];P.splice(i,1);try{await persist();render()}catch(e){P.splice(i,0,old);alert('删除失败：'+e.message)}}
async function saveSet(){try{await persist();alert('设置已保存到云端')}catch(e){alert('保存失败：'+e.message)}}
function renderOrders(){let o=state.orders||[];ordersBox.innerHTML=o.length?o.map(x=>`<div style="padding:9px 0;border-bottom:1px solid #ddd"><b>${x.no}</b> · ${x.name} · RM${(+x.total).toFixed(2)} · ${x.status}</div>`).join(''):'<div class="muted">目前没有订单。</div>'}
load();
</script></body></html>
