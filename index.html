<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mus&Co. | Beyoutiful Studio</title>
<style>
:root{--bg:#eee8df;--card:#fffaf4;--ink:#181512;--muted:#756d65;--line:#d8cec2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 16px 90px}header{padding:20px 0 30px;border-bottom:1px solid var(--line)}.brand{font:34px Georgia,serif}.sub{font-size:10px;letter-spacing:.18em;color:var(--muted);margin-top:5px}.ann{margin-top:28px}.ann .big{font:72px Georgia,serif;line-height:.85}.ann b{font-size:26px}.ann p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:24px}.card{background:var(--card);border:1px solid var(--line);padding:18px;border-radius:16px}.photo{height:210px;background:#e1d9cf;border-radius:11px;margin-bottom:14px;display:flex;align-items:center;justify-content:center;color:#968b80;font:28px Georgia,serif}.photo img{width:100%;height:100%;object-fit:cover;border-radius:11px}.name{font-weight:700;line-height:1.35}.price{font:24px Georgia,serif;margin:9px 0}.qty{display:flex;align-items:center;gap:10px}.qty button{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:50%}.cart{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(870px,calc(100% - 32px));background:var(--ink);color:#fff;padding:15px 18px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 30px #0003}.cart button{background:#fff;color:var(--ink);border:0;padding:10px 15px;border-radius:9px;font-weight:700}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(900px,100%);background:var(--card);border-radius:20px 20px 0 0;padding:22px;max-height:88vh;overflow:auto}.field{margin:12px 0}.field label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff}.field textarea{min-height:80px}.summary{border-top:1px solid var(--line);margin-top:15px;padding-top:14px;line-height:1.8}.discount{color:#7a5734}.actions{display:flex;gap:8px}.actions button{flex:1;padding:12px;border-radius:9px;border:1px solid var(--line)}.primary{background:var(--ink);color:#fff;border-color:var(--ink)!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.photo{height:180px}.ann .big{font-size:58px}}
</style></head><body><div class="wrap"><header><div class="brand">Mus&Co.</div><div class="sub">BY BEYOUTIFUL STUDIO · PROFESSIONAL LASH SUPPLIES</div></header><section class="ann"><div class="big">08</div><b>8TH ANNIVERSARY</b><p>消费满 RM300 · 直接扣 RM80</p></section><div id="grid" class="grid"></div></div>
<div class="cart"><span><b id="count">0</b> 件 · <b id="total">RM0.00</b></span><button onclick="openCart()">查看购物车</button></div>
<div class="modal" id="modal"><div class="sheet"><h2>购物车</h2><div id="items"></div><div class="summary" id="sum"></div><div class="field"><label>姓名</label><input id="customerName"></div><div class="field"><label>WhatsApp</label><input id="customerPhone" placeholder="01X-XXXXXXX"></div><div class="field"><label>取货方式</label><select id="method"><option>店内自取</option><option>邮寄</option></select></div><div class="field"><label>备注</label><textarea id="remark"></textarea></div><div class="actions"><button onclick="closeCart()">继续购物</button><button class="primary" onclick="submitOrder()">提交订单</button></div></div></div>
<script>
let products=[],cart=JSON.parse(localStorage.getItem('musco_cart')||'{}'),settings=JSON.parse(localStorage.getItem('musco_settings')||'{"threshold":300,"discount":80,"whatsapp":""}');
fetch('products.json').then(r=>r.json()).then(x=>{products=x;render()}).catch(()=>{products=[{"id":"glue1","name":"Mus&Co. 韩国 1 秒速干胶水","size":"5ml","price":98,"stock":20,"active":true},{"id":"glue05","name":"Mus&Co. Super Plus 0.5 秒速干胶水","size":"5ml","price":98,"stock":20,"active":true},{"id":"remover","name":"Mus&Co. 日本植物卸膏","price":68,"stock":20,"active":true},{"id":"cleanser","name":"Mus&Co. Cleanser","price":38,"stock":20,"active":true}];render()});
function render(){grid.innerHTML=products.filter(p=>p.active).map(p=>`<div class="card"><div class="photo">${p.image?`<img src="${p.image}">`:'Mus&Co.'}</div><div class="name">${p.name}${p.size?' · '+p.size:''}</div><div class="price">RM${p.price.toFixed(2)}</div><div class="qty"><button onclick="change('${p.id}',-1)">−</button><b>${cart[p.id]||0}</b><button onclick="change('${p.id}',1)">＋</button></div></div>`).join('');update()}
function change(id,n){let p=products.find(x=>x.id===id);cart[id]=Math.max(0,Math.min(p.stock,(cart[id]||0)+n));if(!cart[id])delete cart[id];localStorage.setItem('musco_cart',JSON.stringify(cart));render()}
function calc(){let sub=Object.entries(cart).reduce((a,[id,q])=>a+products.find(p=>p.id===id).price*q,0),d=sub>=settings.threshold?settings.discount:0;return{sub,discount:d,total:Math.max(0,sub-d)}}
function update(){let c=Object.values(cart).reduce((a,b)=>a+b,0);count.textContent=c;total.textContent='RM'+calc().total.toFixed(2)}
function openCart(){items.innerHTML=Object.entries(cart).map(([id,q])=>{let p=products.find(x=>x.id===id);return `<div style="padding:10px 0;border-bottom:1px solid #ddd"><b>${p.name}</b> × ${q}　RM${(p.price*q).toFixed(2)}</div>`}).join('')||'<p>购物车还是空的。</p>';let x=calc();sum.innerHTML=`商品小计：RM${x.sub.toFixed(2)}<br><span class="discount">8周年优惠：${x.discount?'− RM'+x.discount.toFixed(2):'消费满 RM300 即享 − RM80'}</span><br><b>应付：RM${x.total.toFixed(2)}</b>`;modal.classList.add('show')}
function closeCart(){modal.classList.remove('show')}
function submitOrder(){if(!Object.keys(cart).length)return alert('购物车是空的。');if(!customerName.value.trim()||!customerPhone.value.trim())return alert('请填写姓名和 WhatsApp。');let x=calc(),no='MC'+Date.now().toString().slice(-8),o={no,date:new Date().toLocaleString('zh-MY'),name:customerName.value.trim(),phone:customerPhone.value.trim(),method:method.value,remark:remark.value.trim(),items:cart,subtotal:x.sub,discount:x.discount,total:x.total,status:'Pending'};let os=JSON.parse(localStorage.getItem('musco_orders')||'[]');os.unshift(o);localStorage.setItem('musco_orders',JSON.stringify(os));let lines=Object.entries(cart).map(([id,q])=>{let p=products.find(x=>x.id===id);return `${p.name} × ${q} — RM${(p.price*q).toFixed(2)}`}).join('\n');let text=`Mus&Co. 8周年订单\n订单编号：${no}\n顾客：${o.name}\nWhatsApp：${o.phone}\n取货方式：${o.method}\n\n${lines}\n\n小计：RM${x.sub.toFixed(2)}\n8周年优惠：− RM${x.discount.toFixed(2)}\n应付：RM${x.total.toFixed(2)}\n备注：${o.remark||'—'}`;if(navigator.clipboard)navigator.clipboard.writeText(text);if(settings.whatsapp)location.href='https://wa.me/'+settings.whatsapp+'?text='+encodeURIComponent(text);else alert('订单已建立：'+no+'\n订单内容已复制；后台尚未设置 WhatsApp。');cart={};localStorage.setItem('musco_cart','{}');closeCart();render()}
</script></body></html>
